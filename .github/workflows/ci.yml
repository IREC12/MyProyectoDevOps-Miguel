
name: Validacion del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-estructura:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar carpetas
        run: |
          test -d backend
          test -d frontend
          test -d database
          test -d docs
          test -d images
          test -d .github/workflows

      - name: Verificar archivos principales
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitignore

      - name: Finalizar validacion
        run: echo "La estructura del proyecto es correcta"
